name: courtcall
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  # go_router removed — using Navigator push/pop instead
  intl: ^0.19.0
  share_plus: ^10.0.0
  firebase: ^9.0.3
  firebase_core: ^4.9.0
  firebase_auth:
  firebase_messaging:
  flutter_local_notifications:
  cloud_firestore: ^6.4.1
  google_maps_flutter: ^2.17.0
  google_fonts: ^6.3.3
  url_launcher: ^6.2.6
  cloudinary_public: ^0.23.1
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/logo.png"
  web:
    generate: true
    image_path: "assets/images/logo.png"

dependency_overrides:
  http: ^1.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
